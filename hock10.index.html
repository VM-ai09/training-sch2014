<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1769ff">
<title>Общее расписание</title>

<style>
:root{
  --bg:#f3f5f9;--card:#fff;--text:#18202a;--muted:#687384;
  --line:#dfe4ec;--primary:#1769ff;--danger:#e53935;
  --ice:#dff4ff;--game:#f0e2ff;--ofp:#fff0d3;--notice:#fff6d8
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
button.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
button.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
button.small{min-height:32px;padding:6px 9px;font-size:13px}
button{min-height:38px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--text)}
.app{max-width:1200px;margin:auto;padding-bottom:30px}
header{position:sticky;top:0;z-index:5;background:rgba(243,245,249,.95);backdrop-filter:blur(12px);padding:12px;border-bottom:1px solid var(--line)}
.top,.actions,.nav,.type-switch,.day-actions{display:flex;gap:6px;flex-wrap:wrap}
.top{align-items:center}
h1{font-size:21px;margin:0;flex:1}
.nav{align-items:center;margin-top:10px}
.nav-title{flex:1;text-align:center;font-weight:600}
.user-info,.status{font-size:12px;color:var(--muted);padding:5px 12px}
.status.error{color:var(--danger)}
.week{display:grid;grid-template-columns:1fr;gap:10px;padding:12px}
@media(min-width:700px){.week{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1050px){.week{grid-template-columns:repeat(3,1fr)}}
.day{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;min-height:145px;display:flex;flex-direction:column;gap:9px}
.day.today{border:2px solid var(--primary)}
.day.past{opacity:.65}
.day-head{display:flex;justify-content:space-between}
.day-name{color:var(--muted);font-size:13px;font-weight:600}
.day-date{font-size:20px;font-weight:700}
.badge{background:#ff9800;color:#fff;border-radius:20px;padding:3px 8px;font-size:11px}
.training{display:flex;align-items:center;gap:8px;padding:9px;border-radius:9px}
.training.ice{background:var(--ice)}
.training.game{background:var(--game)}
.training.ofp{background:var(--ofp)}
.time{font-weight:700;min-width:100px}
.label,.hint,.info{color:var(--muted);font-size:13px}
.info{white-space:pre-wrap;overflow-wrap:anywhere}
.day-actions{margin-top:auto}
.empty{text-align:center;color:#9aa3af;padding:20px 5px}
.notice{margin:10px 12px 0;padding:10px 12px;background:var(--notice);border:1px solid #e3bd3c;border-radius:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.notice-text{flex:1;font-size:13px}
.auth-screen{max-width:430px;margin:50px auto;padding:22px}
.auth-card{background:var(--card);border-radius:16px;padding:22px;box-shadow:0 8px 30px #0001}
.auth-card h1{display:block;margin-bottom:8px}
.auth-card input{margin-bottom:9px}
.auth-error{color:var(--danger);font-size:13px;min-height:20px;margin-top:8px}
.modal-bg{display:none;position:fixed;inset:0;z-index:20;background:#0008;align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}
.modal{width:100%;max-width:800px;max-height:94vh;overflow:hidden;background:var(--card);border-radius:16px 16px 0 0;display:flex;flex-direction:column}
@media(min-width:650px){.modal-bg{align-items:center}.modal{border-radius:16px;max-height:90vh}}
.modal-head,.modal-foot{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}
.modal-foot{border-top:1px solid var(--line);border-bottom:0;justify-content:flex-end;flex-wrap:wrap}
.modal-title{font-size:18px;font-weight:700}
.modal-body{overflow:auto;padding:15px}
.field{margin-bottom:12px}
label{display:block;color:var(--muted);font-size:13px;font-weight:600;margin-bottom:5px}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--text)}
textarea{min-height:75px;resize:vertical}
.type-switch button{flex:1}
.type-switch button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.error{display:none;color:var(--danger);font-size:13px;margin-top:7px}
.preview{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
td input,td select{min-width:90px;padding:7px;font-size:13px}
#snack{display:none;position:fixed;z-index:50;left:50%;bottom:20px;transform:translateX(-50%);background:#20252d;color:#fff;border-radius:10px;padding:11px 15px}
#snack.show{display:block}
</style>
</head>

<body>

<section id="authScreen" class="auth-screen">
  <div class="auth-card">
    <h1 id="authTitle">Вход в расписание</h1>
    <p id="authSubtitle" class="hint">Войдите, чтобы открыть общее расписание.</p>

    <input id="authEmail" type="email" placeholder="Email" autocomplete="email">
    <input id="authPassword" type="password" placeholder="Пароль минимум 6 символов" autocomplete="current-password">

    <button type="button" id="authSubmit" class="primary" style="width:100%">Войти</button>
    <button type="button" id="authSwitch" style="width:100%;margin-top:8px">Создать аккаунт</button>

    <div id="authError" class="auth-error"></div>
  </div>
</section>

<div id="appScreen" class="app" style="display:none">
<header>
  <div class="top">
    <h1>🏒 Расписание</h1>
    <div class="actions">
      <button class="small" id="importBtn">📋 Текст</button>
      <button class="small" id="copyBtn">➕ Неделя</button>
      <button class="small" id="clearBtn">🧹 Очистить</button>
      <button class="small" id="reminderBtn">🔔 Напоминания</button>
      <button class="small" id="addBtn">＋ Добавить</button>
      <button class="small" id="logoutBtn">Выйти</button>
    </div>
  </div>

  <div id="userInfo" class="user-info"></div>

  <div class="nav">
    <button class="small" id="prevBtn">←</button>
    <div id="weekTitle" class="nav-title"></div>
    <button class="small" id="todayBtn">Сегодня</button>
    <button class="small" id="nextBtn">→</button>
  </div>
</header>

<div id="status" class="status"></div>
<div id="reminderBox"></div>
<main id="week" class="week"></main>
</div>

<div id="modalBg" class="modal-bg">
  <section class="modal">
    <div class="modal-head">
      <div id="modalTitle" class="modal-title"></div>
      <button id="closeModal">✕</button>
    </div>
    <div id="modalBody" class="modal-body"></div>
    <div id="modalFoot" class="modal-foot"></div>
  </section>
</div>

<div id="snack"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
'use strict';

/* =====================================================
   ВСТАВЬТЕ СЮДА ВАШ ОРИГИНАЛЬНЫЙ FIREBASE CONFIG
===================================================== */

const firebaseConfig = {
  apiKey: "AIzaSyAIQckeSKRlzt2oinsITwZqT7-jjJ-XmKM",
  authDomain: "training-sch-2014.firebaseapp.com",
  databaseURL: "https://training-sch-2014-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "training-sch-2014",
  storageBucket: "training-sch-2014.firebasestorage.app",
  messagingSenderId: "384580104354",
  appId: "1:384580104354:web:bb7415ff88aaea5d1da7fb""
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

const DB_PATH = 'sharedSchedule/entries';

const $ = id => document.getElementById(id);

function esc(value){
  return String(value ?? '').replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  }[c]);
}

function uid(){
  return 'id_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
}

function notify(text){
  const el=$('snack');
  el.textContent=text;
  el.classList.add('show');
  clearTimeout(notify.timer);
  notify.timer=setTimeout(()=>el.classList.remove('show'),4000);
}

function status(text,error=false){
  $('status').textContent=text;
  $('status').classList.toggle('error',error);
}

/* ДАТЫ */

const DAYS=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

const MONTHS=[
  'января','февраля','марта','апреля','мая','июня',
  'июля','августа','сентября','октября','ноября','декабря'
];

const MONTHS_MAP={
  января:1,февраля:2,марта:3,апреля:4,мая:5,июня:6,
  июля:7,августа:8,сентября:9,октября:10,ноября:11,декабря:12
};

const DAYS_MAP={
  пн:0,пон:0,понедельник:0,
  вт:1,втор:1,вторник:1,
  ср:2,среда:2,среду:2,
  чт:3,четв:3,четверг:3,
  пт:4,пятн:4,пятница:4,
  сб:5,суббота:5,
  вс:6,воскр:6,воскресенье:6
};

const DateUtil={
  iso(y,m,d){
    return String(y).padStart(4,'0')+'-'+
      String(m).padStart(2,'0')+'-'+
      String(d).padStart(2,'0');
  },

  today(){
    const d=new Date();
    return this.iso(d.getFullYear(),d.getMonth()+1,d.getDate());
  },

  parse(value){
    const m=String(value||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    return m?{y:+m[1],m:+m[2],d:+m[3]}:null;
  },

  valid(y,m,d){
    const date=new Date(Date.UTC(y,m-1,d));
    return date.getUTCFullYear()===y &&
      date.getUTCMonth()===m-1 &&
      date.getUTCDate()===d;
  },

  add(value,days){
    const p=this.parse(value);
    if(!p)return value;

    const d=new Date(Date.UTC(p.y,p.m-1,p.d));
    d.setUTCDate(d.getUTCDate()+days);

    return this.iso(
      d.getUTCFullYear(),
      d.getUTCMonth()+1,
      d.getUTCDate()
    );
  },

  day(value){
    const p=this.parse(value);
    if(!p)return 0;

    return (
      new Date(Date.UTC(p.y,p.m-1,p.d)).getUTCDay()+6
    )%7;
  },

  weekStart(value){
    return this.add(value,-this.day(value));
  },

  short(value){
    const p=this.parse(value);
    return p?String(p.d).padStart(2,'0')+'.'+
      String(p.m).padStart(2,'0'):'';
  },

  full(value){
    const p=this.parse(value);
    return p?`${p.d} ${MONTHS[p.m-1]} ${p.y}`:'';
  },

  range(a,b){
    const A=this.parse(a),B=this.parse(b);
    if(!A||!B)return '';

    if(A.y===B.y&&A.m===B.m){
      return `${A.d}–${B.d} ${MONTHS[A.m-1]} ${A.y}`;
    }

    return `${A.d} ${MONTHS[A.m-1]} – ${B.d} ${MONTHS[B.m-1]} ${B.y}`;
  },

  parseText(value){
    const s=String(value||'').trim().toLowerCase();

    let m=s.match(
      /^(\d{1,2})[./-](\d{1,2})(?:[./-](\d{2,4}))?$/
    );

    if(m){
      let y=m[3]?+m[3]:new Date().getFullYear();
      if(m[3]&&m[3].length===2)y+=2000;

      return this.valid(y,+m[2],+m[1])
        ? this.iso(y,+m[2],+m[1])
        : null;
    }

    m=s.match(
      /^(\d{1,2})\s+([а-яё]+)(?:\s+(\d{4}))?$/i
    );

    if(m){
      const month=MONTHS_MAP[m[2]];
      const y=m[3]?+m[3]:new Date().getFullYear();

      return month&&this.valid(y,month,+m[1])
        ? this.iso(y,month,+m[1])
        : null;
    }

    return null;
  }
};

/* ВРЕМЯ */

const TimeUtil={
  normalize(value){
    let s=String(value||'').trim().toLowerCase().replace(/\s+/g,'');

    if(!s)return '';

    s=s.replace(/^в/,'').replace(/^с/,'').replace(/ч$/,'');

    const result=[];

    for(const part of s.split(/[-–—]/)){
      let m=part.match(/^(\d{1,2})[:.](\d{2})$/);

      if(m){
        const h=+m[1],n=+m[2];
        if(h>23||n>59)return '';
        result.push(
          String(h).padStart(2,'0')+'.'+
          String(n).padStart(2,'0')
        );
        continue;
      }

      m=part.match(/^(\d{1,2})$/);

      if(m){
        if(+m[1]>23)return '';
        result.push(String(+m[1]).padStart(2,'0')+'.00');
        continue;
      }

      m=part.match(/^(\d{4})$/);

      if(m){
        const h=+m[1].slice(0,2);
        const n=+m[1].slice(2);

        if(h>23||n>59)return '';

        result.push(
          String(h).padStart(2,'0')+'.'+
          String(n).padStart(2,'0')
        );
        continue;
      }

      return '';
    }

    return result.join('-');
  },

  start(value){
    return(this.normalize(value)||'99.99').split('-')[0];
  }
};

/* СОСТОЯНИЕ */

const State={
  entries:[],
  offset:0,
  reminders:false,

  week(){
    return DateUtil.add(
      DateUtil.weekStart(DateUtil.today()),
      this.offset*7
    );
  },

  find(date){
    return this.entries.find(item=>item.date===date);
  }
};

/* FIREBASE */

const Shared={
  ref(){
    return db.ref(DB_PATH);
  },

  normalize(data){
    return{
      id:data.id||uid(),
      date:data.date||'',
      type:data.type==='game'?'game':'ice',
      iceStart:TimeUtil.normalize(data.iceStart),
      gameStart:TimeUtil.normalize(data.gameStart),
      ofpStart:TimeUtil.normalize(data.ofpStart),
      comment:data.comment||'',
      route:data.route||'',
      createdBy:data.createdBy||'',
      updatedBy:data.updatedBy||'',
      updatedAt:data.updatedAt||0,
      autoFilled:Boolean(data.autoFilled),
      confirmed:data.confirmed!==false
    };
  },

  async save(record){
    if(!auth.currentUser){
      throw new Error('Пользователь не авторизован');
    }

    const id=record.id||uid();

    const data={
      id,
      date:record.date,
      type:record.type==='game'?'game':'ice',
      iceStart:record.type==='ice'?record.iceStart||'':'',
      gameStart:record.type==='game'?record.gameStart||'':'',
      ofpStart:record.ofpStart||'',
      comment:record.comment||'',
      route:record.route||'',
      createdBy:record.createdBy||auth.currentUser.uid,
      updatedBy:auth.currentUser.uid,
      updatedAt:firebase.database.ServerValue.TIMESTAMP,
      autoFilled:Boolean(record.autoFilled),
      confirmed:record.confirmed!==false
    };

    await this.ref().child(id).set(data);
  },

  async remove(id){
    await this.ref().child(id).remove();
  },

  subscribe(){
    this.ref().off();

    this.ref().on('value',snapshot=>{
      const data=snapshot.val()||{};

      State.entries=Object.values(data)
        .map(item=>this.normalize(item))
        .filter(item=>item.date)
        .sort((a,b)=>a.date.localeCompare(b.date));

      status('Синхронизировано записей: '+State.entries.length);
      UI.render();
    },error=>{
      console.error(error);
      status('Ошибка синхронизации: '+error.message,true);
    });
  }
};

/* ПАРСЕР */

const Parser={
  parse(text){
    const lines=String(text||'')
      .replace(/\r/g,'')
      .split('\n')
      .map(x=>x.trim())
      .filter(Boolean);

    const blocks=[];
    let current=null;
    const week=DateUtil.weekStart(DateUtil.today());

    const dayRe=/^(пн|пон|понедельник|вт|втор|вторник|ср|среда|среду|чт|четв|четверг|пт|пятн|пятница|сб|суббота|вс|воскресенье)\b\s*[-:,.]?\s*(.*)$/i;

    for(const line of lines){
      const day=line.match(dayRe);

      if(day){
        const name=day[1].toLowerCase();
        const rest=day[2].trim();
        const dateInfo=this.extractDate(rest);

        current={
          date:dateInfo
            ?dateInfo.date
            :DateUtil.add(week,DAYS_MAP[name]||0),
          lines:[]
        };

        if(dateInfo?.rest)current.lines.push(dateInfo.rest);
        else if(!dateInfo&&rest)current.lines.push(rest);

        blocks.push(current);
        continue;
      }

      const dateInfo=this.extractDate(line);

      if(dateInfo&&this.startsDate(line)){
        current={date:dateInfo.date,lines:[]};

        if(dateInfo.rest)current.lines.push(dateInfo.rest);

        blocks.push(current);
        continue;
      }

      if(!current){
        current={date:null,lines:[]};
        blocks.push(current);
      }

      current.lines.push(line);
    }

    return blocks.map(item=>this.parseBlock(item));
  },

  startsDate(value){
    return /^\s*\d{1,2}[./-]\d{1,2}/.test(value) ||
      /^\s*\d{1,2}\s+[а-яё]+/i.test(value);
  },

  extractDate(value){
    let m=String(value).match(
      /(^|\s)(\d{1,2}[./-]\d{1,2}(?:[./-]\d{2,4})?)(?=\s|$)/
    );

    if(m){
      const d=DateUtil.parseText(m[2]);

      if(d){
        return{
          date:d,
          rest:String(value).replace(m[0],' ').trim()
        };
      }
    }

    m=String(value).match(
      /(^|\s)(\d{1,2}\s+[а-яё]+(?:\s+\d{4})?)(?=\s|$)/i
    );

    if(m){
      const d=DateUtil.parseText(m[2]);

      if(d){
        return{
          date:d,
          rest:String(value).replace(m[0],' ').trim()
        };
      }
    }

    return null;
  },

  parseBlock(block){
    const text=block.lines.join(' ');
    const lower=text.toLowerCase();

    const result={
      id:uid(),
      date:block.date,
      type:/\b(игра|матч|game|match|турнир|соревнование)\b/i.test(lower)
        ?'game'
        :'ice',
      iceStart:'',
      gameStart:'',
      ofpStart:'',
      comment:'',
      route:''
    };

    if(!block.date){
      result.comment=text;
      return result;
    }

    result.route=this.extractField(text,[
      'как добраться','как добираться','адрес',
      'место','маршрут','проезд','локация','куда','ехать'
    ]);

    result.comment=this.extractField(text,[
      'комментарий','коммент','примечание',
      'важно','заметка','взять','не забыть'
    ]);

    let work=text;

    work=this.removeField(work,[
      'как добраться','как добираться','адрес',
      'место','маршрут','проезд','локация','куда','ехать'
    ]);

    work=this.removeField(work,[
      'комментарий','коммент','примечание',
      'важно','заметка','взять','не забыть'
    ]);

    const pattern='(\\d{1,2}(?:[.:]\\d{2})?(?:\\s*[-–—]\\s*\\d{1,2}(?:[.:]\\d{2})?)?)';

    const ice=this.timeAfter(work,['лёд','лед','каток','ice','ледовая','тренировка'],pattern);
    const game=this.timeAfter(work,['игра','матч','game','match','турнир'],pattern);
    const ofp=this.timeAfter(work,['офп','о.ф.п.','зал','суша','хореография','растяжка'],pattern);

    if(ice){
      result.iceStart=TimeUtil.normalize(ice.time);
      work=work.replace(ice.full,' ');
    }

    if(game){
      result.gameStart=TimeUtil.normalize(game.time);
      work=work.replace(game.full,' ');
    }

    if(ofp){
      result.ofpStart=TimeUtil.normalize(ofp.time);
      work=work.replace(ofp.full,' ');
    }

    if(!result.iceStart&&!result.gameStart){
      const plain=work.match(
        /\d{1,2}[.:]\d{2}(?:\s*[-–—]\s*\d{1,2}[.:]\d{2})?/
      );

      if(plain){
        result.iceStart=TimeUtil.normalize(plain[0]);
        work=work.replace(plain[0],' ');
      }
    }

    const rest=work
      .replace(/[,;|]/g,' ')
      .replace(/\s+/g,' ')
      .trim();

    if(rest){
      result.comment=result.comment
        ?result.comment+'\n'+rest
        :rest;
    }

    return result;
  },

  timeAfter(text,words,pattern){
    const wordPattern=words.join('|');

    let re=new RegExp(
      '(?:^|[^а-яё])(?:'+wordPattern+')\\s*(?:в|с|на)?\\s*'+
      pattern+'(?=$|[^\\d])','i'
    );

    let match=text.match(re);

    if(match){
      const time=match[0].match(
        /\d{1,2}(?:[.:]\d{2})?(?:\s*[-–—]\s*\d{1,2}(?:[.:]\d{2})?)?/
      );

      return time?{time:time[0],full:match[0]}:null;
    }

    re=new RegExp(
      pattern+'\\s*(?:в\\s*)?(?:'+wordPattern+')(?=$|[^а-яё])',
      'i'
    );

    match=text.match(re);

    if(match){
      const time=match[0].match(
        /\d{1,2}(?:[.:]\d{2})?(?:\s*[-–—]\s*\d{1,2}(?:[.:]\d{2})?)?/
      );

      return time?{time:time[0],full:match[0]}:null;
    }

    return null;
  },

  extractField(text,words){
    const m=text.match(new RegExp(
      '(?:'+words.join('|')+')\\s*[:\\-]\\s*([^\\n]+)',
      'i'
    ));

    return m?m[1].trim():'';
  },

  removeField(text,words){
    return text.replace(new RegExp(
      '(?:'+words.join('|')+')\\s*[:\\-]\\s*[^\\n]+',
      'i'
    ),' ');
  }
};

/* НАПОМИНАНИЯ */

const Reminders={
  timers:[],

  clear(){
    this.timers.forEach(timer=>clearTimeout(timer));
    this.timers=[];
  },

  async toggle(){
    if(!('Notification' in window)){
      alert('Браузер не поддерживает уведомления');
      return;
    }

    if(Notification.permission==='denied'){
      alert('Разрешите уведомления в настройках браузера');
      return;
    }

    if(Notification.permission!=='granted'){
      const permission=await Notification.requestPermission();

      if(permission!=='granted'){
        return;
      }
    }

    State.reminders=!State.reminders;

    localStorage.setItem(
      'trainingReminders',
      State.reminders?'true':'false'
    );

    this.schedule();
    UI.render();
  },

  schedule(){
    this.clear();

    if(!State.reminders){
      return;
    }

    if(Notification.permission!=='granted'){
      return;
    }

    const now=Date.now();

    State.entries.forEach(entry=>{
      const time=entry.type==='game'
        ?entry.gameStart
        :entry.iceStart;

      const start=TimeUtil.start(time);
      const match=start.match(/^(\d{2})\.(\d{2})$/);
      const date=DateUtil.parse(entry.date);

      if(!match||!date){
        return;
      }

      const training=new Date(
        date.y,
        date.m-1,
        date.d,
        +match[1],
        +match[2],
        0,
        0
      );

      const reminder=new Date(
        training.getTime()-2*60*60*1000
      );

      const delay=reminder.getTime()-now;

      if(delay<=0){
        return;
      }

      const timer=setTimeout(()=>{
        const title=entry.type==='game'
          ?'🏆 Игра через 2 часа'
          :'🧊 Лёд через 2 часа';

        const body=[
          `Начало: ${time}`,
          entry.ofpStart?`ОФП: ${entry.ofpStart}`:'',
          entry.route||'',
          entry.comment||''
        ].filter(Boolean).join('\n');

        new Notification(title,{body});
      },Math.min(delay,2147483647));

      this.timers.push(timer);
    });
  }
};

/* UI */

const UI={
  render(){
    this.renderReminders();

    const start=State.week();
    const end=DateUtil.add(start,6);

    $('weekTitle').textContent=DateUtil.range(start,end);
    $('week').innerHTML='';

    for(let i=0;i<7;i++){
      $('week').appendChild(
        this.renderDay(DateUtil.add(start,i))
      );
    }

    Reminders.schedule();
  },

  renderReminders(){
    const enabled=State.reminders;
    const box=document.createElement('div');
    box.className='notice';

    const text=document.createElement('div');
    text.className='notice-text';
    text.textContent=enabled
      ?'🔔 Напоминания включены: за 2 часа до занятия.'
      :'🔕 Напоминания выключены.';

    const button=document.createElement('button');
    button.className=enabled?'small':'small primary';
    button.textContent=enabled?'Выключить':'Включить';
    button.onclick=()=>Reminders.toggle();

    box.append(text,button);

    $('reminderBox').innerHTML='';
    $('reminderBox').appendChild(box);
  },

  renderDay(date){
    const item=State.find(date);
    const card=document.createElement('article');

    card.className='day'+
      (date===DateUtil.today()?' today':'')+
      (date<DateUtil.today()?' past':'');

    card.innerHTML=`
      <div class="day-head">
        <div>
          <div class="day-name">${DAYS[DateUtil.day(date)]}</div>
          <div class="day-date">${DateUtil.short(date)}</div>
        </div>
        ${item?.autoFilled?'<span class="badge">авто</span>':''}
      </div>
    `;

    if(!item){
      const empty=document.createElement('div');
      empty.className='empty';
      empty.textContent='Нет тренировок';
      card.appendChild(empty);
    }else{
      const list=[];

      if(item.type==='ice'&&item.iceStart){
        list.push(['ice','🧊','Лёд',item.iceStart]);
      }

      if(item.type==='game'&&item.gameStart){
        list.push(['game','🏆','Игра',item.gameStart]);
      }

      if(item.ofpStart){
        list.push(['ofp','🏋️','ОФП',item.ofpStart]);
      }

      list.sort((a,b)=>
        TimeUtil.start(a[3]).localeCompare(TimeUtil.start(b[3]))
      );

      list.forEach(x=>{
        const el=document.createElement('div');
        el.className='training '+x[0];
        el.innerHTML=`
          <span>${x[1]}</span>
          <span class="time">${esc(x[3])}</span>
          <span class="label">${x[2]}</span>
        `;
        card.appendChild(el);
      });

      if(item.comment){
        const el=document.createElement('div');
        el.className='info';
        el.textContent='💬 '+item.comment;
        card.appendChild(el);
      }

      if(item.route){
        const el=document.createElement('div');
        el.className='info';
        el.textContent='📍 '+item.route;
        card.appendChild(el);
      }
    }

    const actions=document.createElement('div');
    actions.className='day-actions';

    actions.innerHTML=item
      ?`
        <button class="small" data-action="edit">✏️ Изменить</button>
        <button class="small danger" data-action="delete">🗑️ Удалить</button>
      `
      :`
        <button class="small primary" data-action="add">＋ Добавить</button>
      `;

    actions.onclick=event=>{
      const button=event.target.closest('button');

      if(!button){
        return;
      }

      if(button.dataset.action==='add'){
        this.openForm(date,null);
      }

      if(button.dataset.action==='edit'){
        this.openForm(date,item);
      }

      if(button.dataset.action==='delete'){
        this.deleteEntry(date);
      }
    };

    card.appendChild(actions);

    return card;
  },

  openModal(title,body,footer){
    $('modalTitle').textContent=title;
    $('modalBody').innerHTML=body;
    $('modalFoot').innerHTML=footer||'';
    $('modalBg').classList.add('show');
  },

  closeModal(){
    $('modalBg').classList.remove('show');
    $('modalBody').innerHTML='';
    $('modalFoot').innerHTML='';
  },

  openForm(date,item){
    let type=item?.type==='game'?'game':'ice';
    const edit=Boolean(item);

    this.openModal(
      edit?'Редактирование':'Новая запись',
      `
      <div class="field">
        <label>Дата</label>
        <input id="fDate" type="date" value="${date||DateUtil.today()}">
      </div>

      <div class="field">
        <label>Тип</label>
        <div id="typeSwitch" class="type-switch">
          <button type="button" data-type="ice" class="${type==='ice'?'active':''}">🧊 Лёд</button>
          <button type="button" data-type="game" class="${type==='game'?'active':''}">🏆 Игра</button>
        </div>
      </div>

      <div class="field">
        <label id="mainLabel">${type==='game'?'Начало игры':'Начало льда'}</label>
        <input id="fMain" type="text" inputmode="numeric" placeholder="18.00 или 18.00-19.30" value="${esc(type==='game'?item?.gameStart||'':item?.iceStart||'')}">
      </div>

      <div class="field">
        <label>Начало ОФП</label>
        <input id="fOfp" type="text" inputmode="numeric" placeholder="17.00" value="${esc(item?.ofpStart||'')}">
      </div>

      <div class="field">
        <label>Комментарии</label>
        <textarea id="fComment">${esc(item?.comment||'')}</textarea>
      </div>

      <div class="field">
        <label>Как добраться и куда</label>
        <textarea id="fRoute">${esc(item?.route||'')}</textarea>
      </div>

      <div id="fError" class="error"></div>
      `,
      `
      ${edit?'<button type="button" class="danger" id="fDelete">Удалить</button>':''}
      <button type="button" id="fCancel">Отмена</button>
      <button type="button" class="primary" id="fSave">${edit?'Сохранить изменения':'Добавить'}</button>
      `
    );

    const buttons=document.querySelectorAll('[data-type]');

    buttons.forEach(button=>{
      button.onclick=()=>{
        type=button.dataset.type;

        buttons.forEach(item=>{
          item.classList.toggle('active',item===button);
        });

        $('mainLabel').textContent=
          type==='game'?'Начало игры':'Начало льда';

        $('fMain').value=
          type==='game'
            ?item?.gameStart||''
            :item?.iceStart||'';
      };
    });

    $('fCancel').onclick=()=>this.closeModal();

    if(edit){
      $('fDelete').onclick=()=>{
        this.closeModal();
        this.deleteEntry(date);
      };
    }

    $('fSave').onclick=async event=>{
      event.preventDefault();

      const showError=message=>{
        $('fError').textContent=message;
        $('fError').style.display='block';
      };

      try{
        const targetDate=$('fDate').value;
        const main=TimeUtil.normalize($('fMain').value);
        const ofp=TimeUtil.normalize($('fOfp').value);
        const comment=$('fComment').value.trim();
        const route=$('fRoute').value.trim();

        if(!DateUtil.parse(targetDate)){
          showError('Укажите корректную дату');
          return;
        }

        if($('fMain').value&&!main){
          showError('Некорректное время');
          return;
        }

        if($('fOfp').value&&!ofp){
          showError('Некорректное время ОФП');
          return;
        }

        if(!main&&!ofp&&!comment&&!route){
          showError('Заполните хотя бы одно поле');
          return;
        }

        let record=State.find(targetDate);

        if(!record){
          record={
            id:uid(),
            date:targetDate
          };
        }

        record.type=type;
        record.iceStart=type==='ice'?main:'';
        record.gameStart=type==='game'?main:'';
        record.ofpStart=ofp;
        record.comment=comment;
        record.route=route;
        record.autoFilled=false;
        record.confirmed=true;

        await Shared.save(record);

        this.closeModal();
        notify(edit?'Изменения сохранены':'Запись добавлена');

      }catch(errorObject){
        console.error(errorObject);
        showError(errorObject.message||'Ошибка сохранения');
      }
    };
  },

  async deleteEntry(date){
    const record=State.find(date);

    if(!record){
      return;
    }

    if(!confirm('Удалить запись на '+DateUtil.full(date)+'?')){
      return;
    }

    try{
      await Shared.remove(record.id);
      notify('Запись удалена');
    }catch(errorObject){
      console.error(errorObject);
      alert(errorObject.message||'Не удалось удалить запись');
    }
  },

  openImport(){
    this.openModal(
      'Загрузка из текста',
      `
      <div class="field">
        <label>Текст расписания</label>
        <textarea id="importText" style="min-height:210px" placeholder="12.05
Лёд 18.00-19.30
ОФП 17.00
Комментарий: взять воду

13.05
Игра 19.00"></textarea>
      </div>

      <div class="hint">
        Если тип не указан, используется «Лёд».
      </div>

      <div id="importError" class="error"></div>
      `,
      `
      <button type="button" id="importCancel">Отмена</button>
      <button type="button" class="primary" id="parseButton">Разобрать</button>
      `
    );

    $('importCancel').onclick=()=>this.closeModal();

    $('parseButton').onclick=()=>{
      const records=Parser.parse($('importText').value)
        .filter(item=>item.date);

      if(!records.length){
        $('importError').textContent=
          'Даты не найдены. Пример: 12.05 или Пн 12.05';

        $('importError').style.display='block';
        return;
      }

      this.importPreview(records);
    };
  },

  importPreview(records){
    const rows=records.map(record=>`
      <tr>
        <td><input type="checkbox" data-f="enabled" checked></td>
        <td><input type="date" data-f="date" value="${record.date}"></td>
        <td>
          <select data-f="type">
            <option value="ice" ${record.type==='ice'?'selected':''}>🧊 Лёд</option>
            <option value="game" ${record.type==='game'?'selected':''}>🏆 Игра</option>
          </select>
        </td>
        <td><input data-f="time" value="${esc(record.type==='game'?record.gameStart:record.iceStart)}"></td>
        <td><input data-f="ofp" value="${esc(record.ofpStart)}"></td>
        <td><input data-f="comment" value="${esc(record.comment)}"></td>
        <td><input data-f="route" value="${esc(record.route)}"></td>
      </tr>
    `).join('');

    this.openModal(
      'Предпросмотр импорта',
      `
      <div class="preview">
        <table>
          <thead>
            <tr>
              <th></th>
              <th>Дата</th>
              <th>Тип</th>
              <th>Время</th>
              <th>ОФП</th>
              <th>Комментарий</th>
              <th>Маршрут</th>
            </tr>
          </thead>
          <tbody id="previewBody">${rows}</tbody>
        </table>
      </div>
      `,
      `
      <button type="button" id="previewCancel">Отмена</button>
      <button type="button" class="primary" id="saveImport">Добавить в расписание</button>
      `
    );

    $('previewCancel').onclick=()=>this.closeModal();

    $('saveImport').onclick=async()=>{
      let added=0;
      let updated=0;

      try{
        const rows=document.querySelectorAll('#previewBody tr');

        for(const row of rows){
          if(!row.querySelector('[data-f="enabled"]').checked){
            continue;
          }

          const date=row.querySelector('[data-f="date"]').value;
          const type=row.querySelector('[data-f="type"]').value;
          const time=TimeUtil.normalize(row.querySelector('[data-f="time"]').value);
          const ofp=TimeUtil.normalize(row.querySelector('[data-f="ofp"]').value);
          const comment=row.querySelector('[data-f="comment"]').value.trim();
          const route=row.querySelector('[data-f="route"]').value.trim();

          if(!date||(!time&&!ofp&&!comment&&!route)){
            continue;
          }

          let record=State.find(date);

          if(!record){
            record={id:uid(),date};
            added++;
          }else{
            updated++;
          }

          record.type=type;
          record.iceStart=type==='ice'?time:'';
          record.gameStart=type==='game'?time:'';
          record.ofpStart=ofp;
          record.comment=comment;
          record.route=route;
          record.autoFilled=false;
          record.confirmed=true;

          await Shared.save(record);
        }

        if(!added&&!updated){
          alert('Нет данных для сохранения');
          return;
        }

        this.closeModal();
        notify(`Добавлено: ${added}, обновлено: ${updated}`);

      }catch(errorObject){
        console.error(errorObject);
        alert(errorObject.message||'Ошибка импорта');
      }
    };
  },

  async copyNextWeek(){
    const source=State.week();
    const target=DateUtil.add(source,7);
    let count=0;

    try{
      for(let i=0;i<7;i++){
        const from=State.find(DateUtil.add(source,i));

        if(!from){
          continue;
        }

        const date=DateUtil.add(target,i);
        let to=State.find(date);

        if(!to){
          to={id:uid(),date};
        }

        to.type=from.type||'ice';
        to.iceStart=from.iceStart||'';
        to.gameStart=from.gameStart||'';
        to.ofpStart=from.ofpStart||'';
        to.comment=from.comment||'';
        to.route=from.route||'';
        to.autoFilled=true;
        to.confirmed=false;

        await Shared.save(to);
        count++;
      }

      if(!count){
        alert('В текущей неделе нет записей');
        return;
      }

      notify('Следующая неделя заполнена');

    }catch(errorObject){
      console.error(errorObject);
      alert(errorObject.message||'Не удалось скопировать неделю');
    }
  },

  async clearWeek(){
    const start=State.week();
    const end=DateUtil.add(start,6);

    const records=State.entries.filter(item=>
      item.date>=start&&item.date<=end
    );

    if(!records.length){
      alert('В текущей неделе нет записей');
      return;
    }

    if(!confirm('Удалить записей: '+records.length+'?')){
      return;
    }

    try{
      for(const record of records){
        await Shared.remove(record.id);
      }

      notify('Неделя очищена');

    }catch(errorObject){
      console.error(errorObject);
      alert(errorObject.message||'Ошибка очистки');
    }
  }
};

/* АВТОРИЗАЦИЯ */

let authMode='login';

function updateAuthMode(){
  const login=authMode==='login';

  $('authTitle').textContent=login
    ?'Вход в расписание'
    :'Регистрация';

  $('authSubtitle').textContent=login
    ?'Войдите, чтобы открыть общее расписание.'
    :'Создайте аккаунт для доступа к расписанию.';

  $('authSubmit').textContent=login
    ?'Войти'
    :'Зарегистрироваться';

  $('authSwitch').textContent=login
    ?'Создать аккаунт'
    :'У меня уже есть аккаунт';

  $('authPassword').autocomplete=login
    ?'current-password'
    :'new-password';

  $('authError').textContent='';
}

function authMessage(error){
  const messages={
    'auth/invalid-email':'Некорректный email.',
    'auth/missing-password':'Введите пароль.',
    'auth/weak-password':'Пароль должен содержать минимум 6 символов.',
    'auth/email-already-in-use':'Этот email уже зарегистрирован.',
    'auth/user-not-found':'Пользователь не найден.',
    'auth/wrong-password':'Неверный пароль.',
    'auth/invalid-credential':'Неверный email или пароль.',
    'auth/operation-not-allowed':'Включите Email/Password в Firebase Authentication.',
    'auth/network-request-failed':'Ошибка сети.',
    'auth/unauthorized-domain':'Домен не добавлен в Authorized domains.'
  };

  return messages[error.code]||error.message||'Ошибка авторизации';
}

$('authSwitch').onclick=()=>{
  authMode=authMode==='login'?'register':'login';
  updateAuthMode();
};

$('authSubmit').onclick=async()=>{
  const email=$('authEmail').value.trim().toLowerCase();
  const password=$('authPassword').value;

  $('authError').textContent='';

  if(!email){
    $('authError').textContent='Введите email';
    return;
  }

  if(!password){
    $('authError').textContent='Введите пароль';
    return;
  }

  if(authMode==='register'&&password.length<6){
    $('authError').textContent=
      'Пароль должен содержать минимум 6 символов';
    return;
  }

  $('authSubmit').disabled=true;
  $('authSwitch').disabled=true;
  $('authSubmit').textContent=
    authMode==='login'?'Вход...':'Регистрация...';

  try{
    if(authMode==='login'){
      await auth.signInWithEmailAndPassword(email,password);
    }else{
      await auth.createUserWithEmailAndPassword(email,password);
    }
  }catch(errorObject){
    console.error(errorObject);
    $('authError').textContent=authMessage(errorObject);
  }finally{
    $('authSubmit').disabled=false;
    $('authSwitch').disabled=false;
    updateAuthMode();
  }
};

$('logoutBtn').onclick=async()=>{
  await auth.signOut();
};

auth.onAuthStateChanged(user=>{
  if(user){
    $('authScreen').style.display='none';
    $('appScreen').style.display='block';
    $('userInfo').textContent='Пользователь: '+(user.email||user.uid);

    State.reminders=
      localStorage.getItem('trainingReminders')==='true';

    Shared.subscribe();
    UI.render();
  }else{
    $('authScreen').style.display='block';
    $('appScreen').style.display='none';
    State.entries=[];
  }
});

/* СОБЫТИЯ */

$('closeModal').onclick=()=>UI.closeModal();

$('modalBg').onclick=event=>{
  if(event.target===$('modalBg')){
    UI.closeModal();
  }
};

$('prevBtn').onclick=()=>{
  State.offset--;
  UI.render();
};

$('nextBtn').onclick=()=>{
  State.offset++;
  UI.render();
};

$('todayBtn').onclick=()=>{
  State.offset=0;
  UI.render();
};

$('addBtn').onclick=()=>{
  UI.openForm(DateUtil.today(),null);
};

$('importBtn').onclick=()=>{
  UI.openImport();
};

$('copyBtn').onclick=()=>{
  UI.copyNextWeek();
};

$('clearBtn').onclick=()=>{
  UI.clearWeek();
};

$('reminderBtn').onclick=()=>{
  Reminders.toggle();
};

document.addEventListener('visibilitychange',()=>{
  if(!document.hidden){
    Reminders.schedule();
  }
});

document.addEventListener('keydown',event=>{
  if(event.key==='Escape'){
    UI.closeModal();
  }

  if(
    event.key.toLowerCase()==='n' &&
    !['INPUT','TEXTAREA','SELECT']
      .includes(document.activeElement.tagName)
  ){
    UI.openForm(DateUtil.today(),null);
  }
});

updateAuthMode();
</script>
