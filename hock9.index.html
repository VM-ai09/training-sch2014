<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1769ff">
<title>Общее расписание тренировок</title>

<style>
:root{
  --bg:#f3f5f9;
  --card:#fff;
  --text:#18202a;
  --muted:#687384;
  --line:#dfe4ec;
  --primary:#1769ff;
  --danger:#e53935;
  --ice:#dff4ff;
  --game:#f0e2ff;
  --ofp:#fff0d3;
  --notice:#fff6d8;
  --success:#208b4e;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.app{
  max-width:1200px;
  margin:auto;
  padding-bottom:30px;
}

header{
  position:sticky;
  top:0;
  z-index:5;
  background:rgba(243,245,249,.95);
  backdrop-filter:blur(12px);
  padding:12px;
  border-bottom:1px solid var(--line);
}

.top{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

h1{
  font-size:21px;
  margin:0;
  flex:1;
}

.actions,
.nav,
.type-switch,
.day-actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

button{
  min-height:38px;
  padding:8px 12px;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--card);
  color:var(--text);
}

button.primary{
  background:var(--primary);
  color:#fff;
  border-color:var(--primary);
}

button.danger{
  background:var(--danger);
  color:#fff;
  border-color:var(--danger);
}

button.small{
  min-height:32px;
  padding:6px 9px;
  font-size:13px;
}

.nav{
  align-items:center;
  margin-top:10px;
}

.nav-title{
  flex:1;
  text-align:center;
  font-weight:600;
}

.status-bar{
  padding:8px 12px 0;
  font-size:12px;
  color:var(--muted);
}

.status-bar.error{
  color:var(--danger);
}

.week{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
  padding:12px;
}

@media(min-width:700px){
  .week{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(min-width:1050px){
  .week{
    grid-template-columns:repeat(3,1fr);
  }
}

.day{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:13px;
  min-height:145px;
  display:flex;
  flex-direction:column;
  gap:9px;
}

.day.today{
  border:2px solid var(--primary);
}

.day.past{
  opacity:.65;
}

.day-head{
  display:flex;
  justify-content:space-between;
}

.day-name{
  color:var(--muted);
  font-size:13px;
  font-weight:600;
}

.day-date{
  font-size:20px;
  font-weight:700;
}

.badge{
  background:#ff9800;
  color:#fff;
  border-radius:20px;
  padding:3px 8px;
  font-size:11px;
}

.training{
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px;
  border-radius:9px;
}

.training.ice{
  background:var(--ice);
}

.training.game{
  background:var(--game);
}

.training.ofp{
  background:var(--ofp);
}

.time{
  font-weight:700;
  min-width:100px;
}

.label{
  color:var(--muted);
  font-size:13px;
}

.info{
  color:var(--muted);
  font-size:14px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.day-actions{
  margin-top:auto;
}

.empty{
  text-align:center;
  color:#9aa3af;
  padding:20px 5px;
}

.notice{
  margin:10px 12px 0;
  padding:10px 12px;
  background:var(--notice);
  border:1px solid #e3bd3c;
  border-radius:10px;
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}

.notice-text{
  flex:1;
  font-size:13px;
}

.auth-screen{
  max-width:430px;
  margin:50px auto;
  padding:22px;
}

.auth-card{
  background:var(--card);
  border-radius:16px;
  padding:22px;
  box-shadow:0 8px 30px #0001;
}

.auth-card h1{
  display:block;
  margin-bottom:8px;
}

.auth-card input{
  margin-bottom:9px;
}

.auth-error{
  color:var(--danger);
  font-size:13px;
  min-height:20px;
  margin-top:8px;
}

.user-info{
  color:var(--muted);
  font-size:12px;
  padding:5px 12px;
}

.modal-bg{
  display:none;
  position:fixed;
  inset:0;
  z-index:20;
  background:#0008;
  align-items:flex-end;
  justify-content:center;
}

.modal-bg.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:800px;
  max-height:94vh;
  overflow:hidden;
  background:var(--card);
  border-radius:16px 16px 0 0;
  display:flex;
  flex-direction:column;
}

@media(min-width:650px){
  .modal-bg{
    align-items:center;
  }

  .modal{
    border-radius:16px;
    max-height:90vh;
  }
}

.modal-head,
.modal-foot{
  padding:12px 15px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.modal-foot{
  border-top:1px solid var(--line);
  border-bottom:0;
  justify-content:flex-end;
  flex-wrap:wrap;
}

.modal-title{
  font-size:18px;
  font-weight:700;
}

.modal-body{
  overflow:auto;
  padding:15px;
}

.field{
  margin-bottom:12px;
}

label{
  display:block;
  color:var(--muted);
  font-size:13px;
  font-weight:600;
  margin-bottom:5px;
}

input,
textarea,
select{
  width:100%;
  padding:10px;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--card);
  color:var(--text);
}

textarea{
  min-height:75px;
  resize:vertical;
}

.type-switch button{
  flex:1;
}

.type-switch button.active{
  background:var(--primary);
  color:#fff;
  border-color:var(--primary);
}

.error{
  display:none;
  color:var(--danger);
  font-size:13px;
  margin-top:7px;
}

.hint{
  color:var(--muted);
  font-size:13px;
  line-height:1.45;
}

.preview{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}

th,
td{
  padding:6px;
  text-align:left;
  vertical-align:top;
  border-bottom:1px solid var(--line);
}

td input,
td select{
  min-width:90px;
  padding:7px;
  font-size:13px;
}

#snack{
  display:none;
  position:fixed;
  z-index:50;
  left:50%;
  bottom:20px;
  transform:translateX(-50%);
  background:#20252d;
  color:#fff;
  border-radius:10px;
  padding:11px 15px;
}

#snack.show{
  display:block;
}

#snack button{
  border:0;
  background:none;
  color:#ffd54f;
  padding:0 0 0 12px;
}
</style>
</head>

<body>

<!-- ЭКРАН АВТОРИЗАЦИИ -->
<section id="authScreen" class="auth-screen">
  <div class="auth-card">
    <h1>🏒 Общее расписание</h1>

    <p class="hint">
      Войдите или зарегистрируйтесь, чтобы видеть общее расписание команды.
    </p>

    <input
      id="authEmail"
      type="email"
      placeholder="Email"
      autocomplete="email"
    >

    <input
      id="authPassword"

      placeholder="Пароль минимум 6 символов"
      autocomplete="current-password"
    >

    <button id="loginBtn" class="primary" style="width:100%">
      Войти
    </button>

    <button id="registerBtn" style="width:100%;margin-top:8px">
      Зарегистрироваться
    </button>

    <div id="authError" class="auth-error"></div>
  </div>
</section>

<!-- ОСНОВНОЕ ПРИЛОЖЕНИЕ -->
<div id="appScreen" class="app" style="display:none">

<header>
  <div class="top">
    <h1>🏒 Расписание</h1>

    <div class="actions">
      <button class="small" id="importBtn">📋 Текст</button>
      <button class="small" id="copyBtn">➕ Неделя</button>
      <button class="small" id="clearBtn">🧹 Очистить</button>
      <button class="small" id="reminderBtn">🔔 Напоминания</button>
      <button class="small" id="addBtn">＋ Добавить</button>
      <button class="small" id="logoutBtn">Выйти</button>
    </div>
  </div>

  <div class="user-info" id="userInfo"></div>

  <div class="nav">

    <button class="small" id="todayBtn">Сегодня</button>

  </div>
</header>

<div id="statusBar" class="status-bar"></div>
<div id="reminderContainer"></div>
<main id="week" class="week"></main>

</div>

<!-- МОДАЛЬНОЕ ОКНО -->
<div id="modalBg" class="modal-bg">
  <section class="modal">
    <div class="modal-head">
      <div id="modalTitle" class="modal-title"></div>
      <button id="closeModal">✕</button>
    </div>

    <div id="modalBody" class="modal-body"></div>
    <div id="modalFoot" class="modal-foot"></div>
  </section>
</div>

<div id="snack"></div>

<!-- Firebase Compat SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
'use strict';

/* =========================================================
   FIREBASE CONFIG
   ЗАМЕНИТЕ ЗНАЧЕНИЯ НА ДАННЫЕ ИЗ FIREBASE CONSOLE
========================================================= */

const firebaseConfig = {
  apiKey: "AIzaSyAIQckeSKRlzt2oinsITwZqT7-jjJ-XmKM",
  authDomain: "training-sch-2014.firebaseapp.com",
  databaseURL: "https://training-sch-2014-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "training-sch-2014",
  storageBucket: "training-sch-2014.firebasestorage.app",
  messagingSenderId: "384580104354",
  appId: "1:384580104354:web:bb7415ff88aaea5d1da7fb
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

/*
  Общий путь для всех пользователей.
  Все авторизованные пользователи работают
  с одним расписанием.
*/
const DB_PATH = 'sharedSchedule/entries';

/* =========================================================
   ОБЩИЕ ФУНКЦИИ
========================================================= */

const $ = id => document.getElementById(id);

function esc(value){
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#039;'
  }[char]));
}

function uid(){
  return 'id_' + Date.now() + '_' +
    Math.random().toString(36).slice(2,8);
}

function notify(text, undo){
  const el = $('snack');

  el.innerHTML = esc(text);

  if(undo){
    const button = document.createElement('button');
    button.textContent = 'Отменить';

    button.onclick = () => {
      undo();
      el.classList.remove('show');
    };

    el.appendChild(button);
  }

  el.classList.add('show');

  clearTimeout(notify.timer);

  notify.timer = setTimeout(() => {
    el.classList.remove('show');
  }, 7000);
}

function setStatus(text, isError = false){
  const el = $('statusBar');
  el.textContent = text;
  el.classList.toggle('error', isError);
}

/* =========================================================
   ДАТЫ
========================================================= */

const DAYS = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

const MONTHS = [
  'января','февраля','марта','апреля','мая','июня',
  'июля','августа','сентября','октября','ноября','декабря'
];

const MONTHS_MAP = {
  января:1,
  февраля:2,
  марта:3,
  апреля:4,
  мая:5,
  июня:6,
  июля:7,
  августа:8,
  сентября:9,
  октября:10,
  ноября:11,
  декабря:12
};

const DAY_MAP = {
  пн:0,
  пон:0,
  понедельник:0,
  вт:1,
  втор:1,
  вторник:1,
  ср:2,
  среда:2,
  среду:2,
  чт:3,
  четв:3,
  четверг:3,
  пт:4,
  пятн:4,
  пятница:4,
  пятницу:4,
  сб:5,
  суббота:5,
  субботу:5,
  вс:6,
  воскр:6,
  воскресенье:6
};

const DateUtil = {
  iso(y, m, d){
    return String(y).padStart(4,'0') + '-' +
      String(m).padStart(2,'0') + '-' +
      String(d).padStart(2,'0');
  },

  today(){
    const date = new Date();

    return this.iso(
      date.getFullYear(),
      date.getMonth() + 1,
      date.getDate()
    );
  },

  parse(value){
    const match = String(value || '')
      .match(/^(\d{4})-(\d{2})-(\d{2})$/);

    return match
      ? {
          y:Number(match[1]),
          m:Number(match[2]),
          d:Number(match[3])
        }
      : null;
  },

  valid(y, m, d){
    const date = new Date(Date.UTC(y, m - 1, d));

    return date.getUTCFullYear() === y &&
      date.getUTCMonth() === m - 1 &&
      date.getUTCDate() === d;
  },

  add(value, days){
    const parsed = this.parse(value);

    if(!parsed){
      return value;
    }

    const date = new Date(Date.UTC(
      parsed.y,
      parsed.m - 1,
      parsed.d
    ));

    date.setUTCDate(date.getUTCDate() + days);

    return this.iso(
      date.getUTCFullYear(),
      date.getUTCMonth() + 1,
      date.getUTCDate()
    );
  },

  day(value){
    const parsed = this.parse(value);

    if(!parsed){
      return 0;
    }

    const date = new Date(Date.UTC(
      parsed.y,
      parsed.m - 1,
      parsed.d
    ));

    return (date.getUTCDay() + 6) % 7;
  },

  weekStart(value){
    return this.add(value, -this.day(value));
  },

  short(value){
    const parsed = this.parse(value);

    if(!parsed){
      return '';
    }

    return String(parsed.d).padStart(2,'0') + '.' +
      String(parsed.m).padStart(2,'0');
  },

  full(value){
    const parsed = this.parse(value);

    if(!parsed){
      return '';
    }

    return `${parsed.d} ${MONTHS[parsed.m - 1]} ${parsed.y}`;
  },

  range(start, end){
    const a = this.parse(start);
    const b = this.parse(end);

    if(!a || !b){
      return '';
    }

    if(a.y === b.y && a.m === b.m){
      return `${a.d}–${b.d} ${MONTHS[a.m - 1]} ${a.y}`;
    }

    return `${a.d} ${MONTHS[a.m - 1]} – ` +
      `${b.d} ${MONTHS[b.m - 1]} ${b.y}`;
  },

  parseText(value){
    const text = String(value || '').trim().toLowerCase();

    let match = text.match(
      /^(\d{1,2})[./-](\d{1,2})(?:[./-](\d{2,4}))?$/
    );

    if(match){
      let year = match[3]
        ? Number(match[3])
        : new Date().getFullYear();

      if(match[3] && match[3].length === 2){
        year += 2000;
      }

      const day = Number(match[1]);
      const month = Number(match[2]);

      return this.valid(year, month, day)
        ? this.iso(year, month, day)
        : null;
    }

    match = text.match(
      /^(\d{1,2})\s+([а-яё]+)(?:\s+(\d{4}))?$/i
    );

    if(match){
      const day = Number(match[1]);
      const month = MONTHS_MAP[match[2]];
      const year = match[3]
        ? Number(match[3])
        : new Date().getFullYear();

      return month && this.valid(year, month, day)
        ? this.iso(year, month, day)
        : null;
    }

    return null;
  }
};

/* =========================================================
   ВРЕМЯ
========================================================= */

const TimeUtil = {
  normalize(value){
    let text = String(value || '')
      .trim()
      .toLowerCase()
      .replace(/\s+/g,'');

    if(!text){
      return '';
    }

    text = text
      .replace(/^в/,'')
      .replace(/^с/,'')
      .replace(/ч$/,'');

    const result = [];

    for(const part of text.split(/[-–—]/)){
      let match = part.match(/^(\d{1,2})[:.](\d{2})$/);

      if(match){
        const hour = Number(match[1]);
        const minute = Number(match[2]);

        if(hour > 23 || minute > 59){
          return '';
        }

        result.push(
          String(hour).padStart(2,'0') + '.' +
          String(minute).padStart(2,'0')
        );

        continue;
      }

      match = part.match(/^(\d{1,2})$/);

      if(match){
        const hour = Number(match[1]);

        if(hour > 23){
          return '';
        }

        result.push(
          String(hour).padStart(2,'0') + '.00'
        );

        continue;
      }

      match = part.match(/^(\d{4})$/);

      if(match){
        const hour = Number(match[1].slice(0,2));
        const minute = Number(match[1].slice(2));

        if(hour > 23 || minute > 59){
          return '';
        }

        result.push(
          String(hour).padStart(2,'0') + '.' +
          String(minute).padStart(2,'0')
        );

        continue;
      }

      return '';
    }

    return result.join('-');
  },

  start(value){
    return (this.normalize(value) || '99.99').split('-')[0];
  }
};

/* =========================================================
   СОСТОЯНИЕ
========================================================= */

const State = {
  entries: [],
  offset: 0,
  firebaseListener: null,

  week(){
    return DateUtil.add(
      DateUtil.weekStart(DateUtil.today()),
      this.offset * 7
    );
  },

  find(date){
    return this.entries.find(entry => entry.date === date);
  }
};

/* =========================================================
   FIREBASE: ОБЩЕЕ РАСПИСАНИЕ
========================================================= */

const SharedSchedule = {
  ref(){
    return db.ref(DB_PATH);
  },

  normalizeEntry(data){
    return {
      id: data.id || uid(),
      date: data.date || '',
      type: data.type === 'game' ? 'game' : 'ice',
      iceStart: TimeUtil.normalize(data.iceStart),
      gameStart: TimeUtil.normalize(data.gameStart),
      ofpStart: TimeUtil.normalize(data.ofpStart),
      comment: data.comment || '',
      route: data.route || '',
      createdBy: data.createdBy || '',
      updatedBy: data.updatedBy || '',
      updatedAt: data.updatedAt || 0,
      autoFilled: Boolean(data.autoFilled),
      confirmed: data.confirmed !== false
    };
  },

  async save(entry){
    if(!auth.currentUser){
      throw new Error('Пользователь не авторизован');
    }

    const id = entry.id || uid();

    const data = {
      id,
      date: entry.date,
      type: entry.type === 'game' ? 'game' : 'ice',
      iceStart: entry.type === 'ice'
        ? entry.iceStart || ''
        : '',
      gameStart: entry.type === 'game'
        ? entry.gameStart || ''
        : '',
      ofpStart: entry.ofpStart || '',
      comment: entry.comment || '',
      route: entry.route || '',
      createdBy: entry.createdBy || auth.currentUser.uid,
      updatedBy: auth.currentUser.uid,
      updatedAt: firebase.database.ServerValue.TIMESTAMP,
      autoFilled: Boolean(entry.autoFilled),
      confirmed: entry.confirmed !== false
    };

    await this.ref()
      .child(id)
      .set(data);

    return data;
  },

  async remove(id){
    if(!auth.currentUser){
      throw new Error('Пользователь не авторизован');
    }

    await this.ref()
      .child(id)
      .remove();
  },

  subscribe(){
    if(State.firebaseListener){
      this.ref().off('value', State.firebaseListener);
    }

    State.firebaseListener = snapshot => {
      const data = snapshot.val() || {};

      State.entries = Object.values(data)
        .map(item => this.normalizeEntry(item))
        .filter(item => item.date)
        .sort((a,b) => a.date.localeCompare(b.date));

      UI.render();
      setStatus(
        `Синхронизировано записей: ${State.entries.length}`
      );
    };

    this.ref().on('value', State.firebaseListener, error => {
      console.error(error);
      setStatus(
        'Ошибка синхронизации: ' + error.message,
        true
      );
    });
  }
};

/* =========================================================
   ПАРСЕР ТЕКСТА
========================================================= */

const Parser = {
  parse(text){
    const lines = String(text || '')
      .replace(/\r/g,'')
      .split('\n')
      .map(line => line.trim())
      .filter(Boolean);

    const blocks = [];
    let current = null;
    const week = DateUtil.weekStart(DateUtil.today());

    const dayPattern =
      /^(пн|пон|понедельник|вт|втор|вторник|ср|среда|среду|чт|четв|четверг|пт|пятн|пятница|пятницу|сб|суббота|субботу|вс|воскр|воскресенье)\b\s*[-:,.]?\s*(.*)$/i;

    for(const line of lines){
      const dayMatch = line.match(dayPattern);

      if(dayMatch){
        const dayName = dayMatch[1].toLowerCase();
        const rest = dayMatch[2].trim();
        const dateInfo = this.extractDate(rest);

        const block = {
          date: dateInfo
            ? dateInfo.date
            : DateUtil.add(week, DAY_MAP[dayName] || 0),
          lines: []
        };

        if(dateInfo && dateInfo.rest){
          block.lines.push(dateInfo.rest);
        }else if(!dateInfo && rest){
          block.lines.push(rest);
        }

        blocks.push(block);
        current = block;
        continue;
      }

      const dateInfo = this.extractDate(line);

      if(dateInfo && this.startsWithDate(line)){
        current = {
          date: dateInfo.date,
          lines: []
        };

        if(dateInfo.rest){
          current.lines.push(dateInfo.rest);
        }

        blocks.push(current);
        continue;
      }

      if(!current){
        current = {
          date: null,
          lines: []
        };

        blocks.push(current);
      }

      current.lines.push(line);
    }

    return blocks.map(block => this.parseBlock(block));
  },

  startsWithDate(value){
    return /^\s*\d{1,2}[./-]\d{1,2}/.test(value) ||
      /^\s*\d{1,2}\s+[а-яё]+/i.test(value);
  },

  extractDate(value){
    let match = String(value).match(
      /(^|\s)(\d{1,2}[./-]\d{1,2}(?:[./-]\d{2,4})?)(?=\s|$)/
    );

    if(match){
      const date = DateUtil.parseText(match[2]);

      if(date){
        return {
          date,
          rest: String(value).replace(match[0], ' ').trim()
        };
      }
    }

    match = String(value).match(
      /(^|\s)(\d{1,2}\s+[а-яё]+(?:\s+\d{4})?)(?=\s|$)/i
    );

    if(match){
      const date = DateUtil.parseText(match[2]);

      if(date){
        return {
          date,
          rest: String(value).replace(match[0], ' ').trim()
        };
      }
    }

    return null;
  },

  parseBlock(block){
    const text = block.lines.join(' ');
    const lower = text.toLowerCase();

    const result = {
      id: uid(),
      date: block.date,
      type: /\b(игра|матч|game|match|турнир|соревнование)\b/i.test(lower)
        ? 'game'
        : 'ice',
      iceStart: '',
      gameStart: '',
      ofpStart: '',
      comment: '',
      route: ''
    };

    if(!block.date){
      result.comment = text;
      return result;
    }

    result.route = this.extractField(text, [
      'как добраться',
      'как добираться',
      'адрес',
      'место',
      'маршрут',
      'проезд',
      'локация',
      'куда',
      'ехать'
    ]);

    result.comment = this.extractField(text, [
      'комментарий',
      'коммент',
      'примечание',
      'важно',
      'заметка',
      'взять',
      'не забыть'
    ]);

    let work = text;

    work = this.removeField(work, [
      'как добраться',
      'как добираться',
      'адрес',
      'место',
      'маршрут',
      'проезд',
      'локация',
      'куда',
      'ехать'
    ]);

    work = this.removeField(work, [
      'комментарий',
      'коммент',
      'примечание',
      'важно',
      'заметка',
      'взять',
      'не забыть'
    ]);

    const timePattern =
      '(\\d{1,2}(?:[.:]\\d{2})?(?:\\s*[-–—]\\s*\\d{1,2}(?:[.:]\\d{2})?)?)';

    const ice = this.findTimeAfterWords(
      work,
      ['лёд','лед','каток','ice','ледовая','тренировка'],
      timePattern
    );

    const game = this.findTimeAfterWords(
      work,
      ['игра','матч','game','match','турнир','соревнование'],
      timePattern
    );

    const ofp = this.findTimeAfterWords(
      work,
      ['офп','о.ф.п.','зал','суша','хореография','растяжка','физуха'],
      timePattern
    );

    if(ice){
      result.iceStart = TimeUtil.normalize(ice.time);
      work = work.replace(ice.full, ' ');
    }

    if(game){
      result.gameStart = TimeUtil.normalize(game.time);
      work = work.replace(game.full, ' ');
    }

    if(ofp){
      result.ofpStart = TimeUtil.normalize(ofp.time);
      work = work.replace(ofp.full, ' ');
    }

    /*
      Если тип не указан:
      12.05
      18.00

      время считается льдом.
    */
    if(!result.iceStart && !result.gameStart){
      const plain = work.match(
        /\d{1,2}[.:]\d{2}(?:\s*[-–—]\s*\d{1,2}[.:]\d{2})?/
      );

      if(plain){
        result.iceStart = TimeUtil.normalize(plain[0]);
        work = work.replace(plain[0], ' ');
      }
    }

    const rest = work
      .replace(/[,;|]/g,' ')
      .replace(/\s+/g,' ')
      .trim();

    if(rest){
      result.comment = result.comment
        ? result.comment + '\n' + rest
        : rest;
    }

    return result;
  },

  findTimeAfterWords(text, words, timePattern){
    const wordPattern = words.join('|');

    let regex = new RegExp(
      '(?:^|[^а-яё])(?:' + wordPattern +
      ')\\s*(?:в|с|на)?\\s*' +
      timePattern +
      '(?=$|[^\\d])',
      'i'
    );

    let match = text.match(regex);

    if(match){
      const time = match[0].match(
        /\d{1,2}(?:[.:]\d{2})?(?:\s*[-–—]\s*\d{1,2}(?:[.:]\d{2})?)?/
      );

      return time
        ? { time: time[0], full: match[0] }
        : null;
    }

    regex = new RegExp(
      timePattern +
      '\\s*(?:в\\s*)?(?:' +
      wordPattern +
      ')(?=$|[^а-яё])',
      'i'
    );

    match = text.match(regex);

    if(match){
      const time = match[0].match(
        /\d{1,2}(?:[.:]\d{2})?(?:\s*[-–—]\s*\d{1,2}(?:[.:]\d{2})?)?/
      );

      return time
        ? { time: time[0], full: match[0] }
        : null;
    }

    return null;
  },

  extractField(text, words){
    const regex = new RegExp(
      '(?:' + words.join('|') +
      ')\\s*[:\\-]\\s*([^\\n]+)',
      'i'
    );

    const match = text.match(regex);

    return match
      ? match[1].trim()
      : '';
  },

  removeField(text, words){
    const regex = new RegExp(
      '(?:' + words.join('|') +
      ')\\s*[:\\-]\\s*[^\\n]+',
      'i'
    );

    return text.replace(regex, ' ');
  }
};

========================================================= */

const Reminders = {
  timers: [],

  clear(){
    this.timers.forEach(timer => clearTimeout(timer));
    this.timers = [];
  },

  async toggle(){
    if(!('Notification' in window)){
      alert('Этот браузер не поддерживает уведомления');
      return;
    }

    if(Notification.permission === 'denied'){
      alert(
        'Уведомления запрещены. Разрешите их в настройках браузера.'
      );
      return;
    }

    if(Notification.permission !== 'granted'){
      const permission = await Notification.requestPermission();

      if(permission !== 'granted'){
        return;
      }
    }

    State.data.reminders = !State.data.reminders;

    localStorage.setItem(
      'trainingRemindersEnabled',
      State.data.reminders ? 'true' : 'false'
    );

    this.schedule();
    UI.render();
  },

  schedule(){
    this.clear();

    const enabled =
      State.data.reminders ||
      localStorage.getItem('trainingRemindersEnabled') === 'true';

    if(!enabled){
      return;
    }

    if(!('Notification' in window)){
      return;
    }

    if(Notification.permission !== 'granted'){
      return;
    }

    const now = Date.now();

    State.entries.forEach(entry => {
      const time = entry.type === 'game'
        ? entry.gameStart
        : entry.iceStart;

      const start = TimeUtil.start(time);
      const match = start.match(/^(\d{2})\.(\d{2})$/);
      const date = DateUtil.parse(entry.date);

      if(!match || !date){
        return;
      }

      const trainingDate = new Date(
        date.y,
        date.m - 1,
        date.d,
        Number(match[1]),
        Number(match[2]),
        0,
        0
      );

      const reminderDate = new Date(
        trainingDate.getTime() - 2 * 60 * 60 * 1000
      );

      const delay = reminderDate.getTime() - now;

      if(delay <= 0){
        return;
      }

      const maxDelay = 2147483647;

      const timer = setTimeout(() => {
        if(delay > maxDelay){
          this.schedule();
          return;
        }

        const title = entry.type === 'game'
          ? '🏆 Игра через 2 часа'
          : '🧊 Лёд через 2 часа';

        const body = [
          `Начало: ${time}`,
          entry.ofpStart ? `ОФП: ${entry.ofpStart}` : '',
          entry.route || '',
          entry.comment || ''
        ].filter(Boolean).join('\n');

        const notification = new Notification(title, {
          body,
          tag: `training-${entry.id}`
        });

        notification.onclick = () => {
          window.focus();
          notification.close();
        };
      }, Math.min(delay, maxDelay));

      this.timers.push(timer);
    });
  }
};

    const item = State.find(date);
    const card = document.createElement('article');

      (date < DateUtil.today() ? ' past' : '');

    card.innerHTML = `
      <div class="day-head">

          : ''}
      </div>
    `;

    if(!item){
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'Нет тренировок';
      card.appendChild(empty);
    }else{
      const trainings = [];

      if(item.type === 'ice' && item.iceStart){
        trainings.push({
          className:'ice',
          icon:'🧊',
          label:'Лёд',
          time:item.iceStart
        });
      }

      if(item.type === 'game' && item.gameStart){
        trainings.push({
          className:'game',
          icon:'🏆',
          label:'Игра',
          time:item.gameStart
        });
      }

      if(item.ofpStart){
        trainings.push({
          className:'ofp',
          icon:'🏋️',
          label:'ОФП',
          time:item.ofpStart
        });
      }

      trainings.sort((a,b) =>
        TimeUtil.start(a.time)
          .localeCompare(TimeUtil.start(b.time))
      );

      trainings.forEach(training => {
        const element = document.createElement('div');

        element.className =
          'training ' + training.className;

        element.innerHTML = `
          <span>${training.icon}</span>
          <span class="time">${esc(training.time)}</span>
          <span class="label">${training.label}</span>
        `;

        card.appendChild(element);
      });

      if(item.comment){
        const element = document.createElement('div');
        element.className = 'info';
        element.textContent = '💬 ' + item.comment;
        card.appendChild(element);
      }

      if(item.route){
        const element = document.createElement('div');
        element.className = 'info';
        element.textContent = '📍 ' + item.route;
        card.appendChild(element);
      }

      if(item.updatedBy){
        const element = document.createElement('div');
        element.className = 'hint';
        element.textContent = 'Изменено пользователем';
        card.appendChild(element);
      }
    }

    const actions = document.createElement('div');

      ? `
        <button class="small" data-action="edit">
          ✏️ Изменить
        </button>

        <button class="small danger" data-action="delete">
          🗑️ Удалить
        </button>
      `
      : `

          ＋ Добавить
        </button>
      `;

    actions.onclick = event => {
      const button = event.target.closest('button');

      if(!button){

      }

      if(button.dataset.action === 'add'){
        this.openForm(date, null);
      }

      if(button.dataset.action === 'edit'){
        this.openForm(date, item);
      }

      if(button.dataset.action === 'delete'){
        this.deleteEntry(date);
      }
    };

    card.appendChild(actions);

    return card;

          >
        </td>

        <td>
          <input
            data-field="ofp"
            value="${esc(record.ofpStart)}"
            placeholder="17.00"
          >
        </td>

        <td>
          <input
            data-field="comment"
            value="${esc(record.comment)}"
          >
        </td>

        <td>
          <input
            data-field="route"
            value="${esc(record.route)}"
          >
        </td>
      </tr>
    `).join('');

    this.openModal(
      'Предпросмотр импорта',

      `
      <div class="hint">
        Проверьте дату, тип занятия и время.
      </div>

      <div class="preview">
        <table>
          <thead>
            <tr>
              <th></th>
              <th>Дата</th>
              <th>Тип</th>
              <th>Время</th>
              <th>ОФП</th>
              <th>Комментарий</th>
              <th>Маршрут</th>
            </tr>
          </thead>

          <tbody id="previewBody">
            ${rows}
          </tbody>
        </table>
      </div>
      `,

      `
      <button type="button" id="previewCancel">
        Отмена
      </button>

      <button type="button" class="primary" id="saveImport">
        Добавить в расписание
      </button>
      `
    );

    $('previewCancel').onclick = () => {
      this.closeModal();
    };

    $('saveImport').onclick = async () => {
      const rows =
        document.querySelectorAll('#previewBody tr');

      let added = 0;
      let updated = 0;

      try{
        for(const row of rows){
          const enabled =
            row.querySelector('[data-field="enabled"]')
              .checked;

          if(!enabled){
            continue;
          }

          const date =
            row.querySelector('[data-field="date"]').value;

          const type =
            row.querySelector('[data-field="type"]').value;

          const time =
            TimeUtil.normalize(
              row.querySelector('[data-field="time"]').value
            );

          const ofp =
            TimeUtil.normalize(
              row.querySelector('[data-field="ofp"]').value
            );

          const comment =
            row.querySelector('[data-field="comment"]')
              .value.trim();

          const route =
            row.querySelector('[data-field="route"]')
              .value.trim();

          if(!date){
            continue;
          }

          if(!time && !ofp && !comment && !route){
            continue;
          }

          let record = State.find(date);

          if(!record){
            record = {
              id: uid(),
              date,
              type,
              iceStart: '',
              gameStart: '',
              ofpStart: '',
              comment: '',
              route: '',
              autoFilled: false,
              confirmed: true
            };

            added++;
          }else{
            updated++;
          }

          record.type = type;
          record.iceStart =
            type === 'ice'
              ? time
              : '';

          record.gameStart =
            type === 'game'
              ? time
              : '';

          record.ofpStart = ofp;
          record.comment = comment;
          record.route = route;
          record.autoFilled = false;
          record.confirmed = true;

          await SharedSchedule.save(record);
        }

        if(!added && !updated){
          alert('Нет данных для сохранения');
          return;
        }

        this.closeModal();

        notify(
          `Добавлено: ${added}, обновлено: ${updated}`
        );

      }catch(errorObject){
        console.error(errorObject);

        alert(
          errorObject.message ||
          'Не удалось сохранить импорт'
        );
      }
    };
  },

  async copyNextWeek(){
    const sourceStart = State.week();
    const targetStart = DateUtil.add(sourceStart, 7);

    let count = 0;

    try{
      for(let i = 0; i < 7; i++){
        const source =
          State.find(DateUtil.add(sourceStart, i));

        if(!source){
          continue;
        }

        const targetDate =
          DateUtil.add(targetStart, i);

        let target = State.find(targetDate);

        if(!target){
          target = {
            id: uid(),
            date: targetDate
          };
        }

        target.type = source.type || 'ice';
        target.iceStart = source.iceStart || '';
        target.gameStart = source.gameStart || '';
        target.ofpStart = source.ofpStart || '';
        target.comment = source.comment || '';
        target.route = source.route || '';
        target.autoFilled = true;
        target.confirmed = false;

        await SharedSchedule.save(target);
        count++;
      }

      if(!count){
        alert(
          'В текущей неделе нет записей для копирования'
        );
        return;
      }

      notify(
        `Скопировано дней: ${count}`
      );

    }catch(errorObject){
      console.error(errorObject);

      alert(
        errorObject.message ||
        'Не удалось скопировать неделю'
      );
    }
  },

  async clearWeek(){
    const start = State.week();
    const end = DateUtil.add(start, 6);

    const records = State.entries.filter(item =>
      item.date >= start &&
      item.date <= end
    );

    if(!records.length){
      alert('В текущей неделе нет записей');
      return;
    }

    if(!confirm(
      `Удалить записей: ${records.length}?`
    )){
      return;
    }

    try{
      for(const record of records){
        await SharedSchedule.remove(record.id);
      }

      notify('Неделя очищена');

    }catch(errorObject){
      console.error(errorObject);

      alert(
        errorObject.message ||
        'Не удалось очистить неделю'
      );
    }
  }
};

/* =========================================================
   АВТОРИЗАЦИЯ
========================================================= */

function authErrorMessage(error){
  const messages = {
    'auth/invalid-email':'Некорректный email',
    'auth/user-not-found':'Пользователь не найден',
    'auth/wrong-password':'Неверный пароль',
    'auth/invalid-credential':'Неверный email или пароль',
    'auth/email-already-in-use':'Этот email уже зарегистрирован',
    'auth/weak-password':'Пароль слишком простой',
    'auth/network-request-failed':'Ошибка сети'
  };

  return messages[error.code] ||
    error.message ||
    'Ошибка авторизации';
}

$('loginBtn').onclick = async () => {
  const email = $('authEmail').value.trim();
  const password = $('authPassword').value;
  const errorElement = $('authError');

  errorElement.textContent = '';

  if(!email || !password){
    errorElement.textContent =
      'Введите email и пароль';
    return;
  }

  try{
    await auth.signInWithEmailAndPassword(
      email,
      password
    );
  }catch(errorObject){
    console.error(errorObject);
    errorElement.textContent =
      authErrorMessage(errorObject);
  }
};

$('registerBtn').onclick = async () => {
  const email = $('authEmail').value.trim();
  const password = $('authPassword').value;
  const errorElement = $('authError');

  errorElement.textContent = '';

  if(!email || !password){
    errorElement.textContent =
      'Введите email и пароль';
    return;
  }

  if(password.length < 6){
    errorElement.textContent =
      'Пароль должен быть минимум 6 символов';
    return;
  }

  try{
    await auth.createUserWithEmailAndPassword(
      email,
      password
    );
  }catch(errorObject){
    console.error(errorObject);
    errorElement.textContent =
      authErrorMessage(errorObject);
  }
};

$('logoutBtn').onclick = async () => {
  await auth.signOut();
};

auth.onAuthStateChanged(async user => {
  if(user){
    $('authScreen').style.display = 'none';
    $('appScreen').style.display = 'block';

    $('userInfo').textContent =
      `Вы вошли как: ${user.email}`;

    State.data = {
      reminders:
        localStorage.getItem('trainingRemindersEnabled') === 'true'
    };

    SharedSchedule.subscribe();
    Reminders.schedule();
    UI.render();
  }else{
    $('authScreen').style.display = 'block';
    $('appScreen').style.display = 'none';

    State.entries = [];
  }
});

/* =========================================================
   СОБЫТИЯ ПРИЛОЖЕНИЯ
========================================================= */

$('closeModal').onclick = () => {
  UI.closeModal();
};

$('modalBg').onclick = event => {
  if(event.target === $('modalBg')){
    UI.closeModal();
  }
};

$('prevBtn').onclick = () => {
  State.offset--;
  UI.render();
};

$('nextBtn').onclick = () => {
  State.offset++;
  UI.render();
};

$('todayBtn').onclick = () => {
  State.offset = 0;
  UI.render();
};

$('addBtn').onclick = () => {
  UI.openForm(DateUtil.today(), null);
};

$('importBtn').onclick = () => {
  UI.openImport();
};

$('copyBtn').onclick = () => {
  UI.copyNextWeek();
};

$('clearBtn').onclick = () => {
  UI.clearWeek();
};

$('reminderBtn').onclick = () => {
  Reminders.toggle();
};

document.addEventListener('visibilitychange', () => {
  if(!document.hidden){
    Reminders.schedule();
  }
});

document.addEventListener('keydown', event => {
  if(event.key === 'Escape'){
    UI.closeModal();
  }

  if(
    event.key.toLowerCase() === 'n' &&
    !['INPUT','TEXTAREA','SELECT']
      .includes(document.activeElement.tagName)
  ){
    UI.openForm(DateUtil.today(), null);
  }
});
